name: release

# PKG-001.5: package versions with code coverage, promoted on a v* tag, install links in the release notes.
# Human gate (T6.3): OQ-1, OQ-2 and OQ-3 resolved and the live evals run by the maintainer before tagging.
on:
  push:
    tags: ['v*']

# gh release create needs write access to repository contents.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEVHUB_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global @salesforce/cli
      - name: Authenticate Dev Hub
        run: |
          echo "$DEVHUB_AUTH_URL" > devhub.url
          sf org login sfdx-url --sfdx-url-file devhub.url --alias devhub --set-default-dev-hub
          rm -f devhub.url
      - name: Definition hashes are current
        run: node scripts/hash-definitions.js --check
      - name: Create and promote package versions in dependency order
        # Resumable: a package that already has a released version for its versionNumber is reused, so a
        # run stopped by the Dev Hub daily Package2VersionCreates limit can be re-run the next day.
        run: |
          set -euo pipefail
          : > install-links.md
          for p in gavel-core gavel-flow gavel-shadow gavel-calibrate gavel-admin gavel-pack-agentforce-gate gavel-pack-service gavel-pack-sales-marketing; do
            ver=$(jq -r --arg p "$p" '.packageDirectories[] | select(.package == $p) | .versionNumber' sfdx-project.json | sed 's/\.NEXT$//')
            id=$(sf package version list --packages "$p" --released --json | jq -r --arg v "$ver." '[.result[] | select(.Version | startswith($v))] | sort_by(.Version) | last | .SubscriberPackageVersionId // empty')
            if [ -z "$id" ]; then
              id=$(sf package version create --package "$p" --code-coverage --installation-key-bypass --wait 90 --json | jq -r '.result.SubscriberPackageVersionId // empty')
              [ -n "$id" ] || { echo "::error::version create failed for $p"; exit 1; }
              sf package version promote --package "$id" --no-prompt
            else
              echo "$p $ver already released: $id"
            fi
            echo "- $p: https://login.salesforce.com/packaging/installPackage.apexp?p0=$id" >> install-links.md
          done
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Install in this order. Each link is the promoted unlocked package version."; echo; cat install-links.md; } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Gavel $GITHUB_REF_NAME" --notes-file notes.md \
            || gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
