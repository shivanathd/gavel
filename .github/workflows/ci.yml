name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EVALS: docs/spec/active/2026-10-01-gavel-v1/evals
  # Dev Hub auth comes from repository secrets only. Never commit auth URLs or keys.
  DEVHUB_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
  ORG_AUTH_KEY: ${{ secrets.CI_ORG_AUTH_KEY }}

jobs:
  # Repo-only checks: no org needed.
  egress-check:
    name: egress-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Data leaving your org page lists every state field
        run: ./scripts/docs-egress-check.sh
      - name: Definition hashes match and versions were bumped
        run: node scripts/hash-definitions.js --check
      - name: ADR headings
        run: bash "$EVALS/tasks/T6.2.sh"

  lwc-jest:
    name: lwc-jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx sfdx-lwc-jest --ci --coverage

  code-analyzer:
    name: code-analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global @salesforce/cli
      - run: sf plugins install code-analyzer
      - name: Fail on high-severity findings (M6)
        run: sf code-analyzer run --workspace packages --severity-threshold 2 --output-file code-analyzer.html
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: code-analyzer-report, path: code-analyzer.html }

  # Org pipeline: scratch -> deploy -> apex-tests -> evals-offline
  scratch:
    name: scratch
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.devhub.outputs.ready }}
    steps:
      # Forks and repos without the Dev Hub secret skip the org pipeline instead of failing.
      - id: devhub
        name: Dev Hub secret present
        run: |
          if [ -n "$DEVHUB_AUTH_URL" ]; then echo ready=true >> "$GITHUB_OUTPUT"
          else echo "::notice::DEVHUB_SFDX_AUTH_URL is not set, so the org pipeline is skipped."; echo ready=false >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.devhub.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.devhub.outputs.ready == 'true'
        with: { node-version: 22 }
      - run: npm install --global @salesforce/cli
        if: steps.devhub.outputs.ready == 'true'
      - name: Authenticate Dev Hub
        if: steps.devhub.outputs.ready == 'true'
        run: |
          echo "$DEVHUB_AUTH_URL" > devhub.url
          sf org login sfdx-url --sfdx-url-file devhub.url --alias devhub --set-default-dev-hub
          rm -f devhub.url
      - name: Create scratch org
        if: steps.devhub.outputs.ready == 'true'
        run: sf org create scratch -d -a gavel-scratch -f config/project-scratch-def.json -v devhub --duration-days 1 --wait 20
      - name: Hand the org to later jobs (encrypted)
        if: steps.devhub.outputs.ready == 'true'
        run: |
          sf org auth show-sfdx-auth-url --target-org gavel-scratch --json | jq -r '.result.sfdxAuthUrl' \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ORG_AUTH_KEY -out org.auth.enc
      - uses: actions/upload-artifact@v4
        if: steps.devhub.outputs.ready == 'true'
        with: { name: scratch-org, path: org.auth.enc, retention-days: 1 }

  deploy:
    name: deploy
    needs: scratch
    if: needs.scratch.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global @salesforce/cli
      - uses: actions/download-artifact@v4
        with: { name: scratch-org }
      - name: Login to scratch org
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ORG_AUTH_KEY -in org.auth.enc -out org.url
          sf org login sfdx-url --sfdx-url-file org.url --alias gavel-scratch
          rm -f org.url
      - name: Deploy all packages in dependency order
        run: ./scripts/deploy.sh --org gavel-scratch --packs service,sales-marketing,agentforce-gate --sample-data

  apex-tests:
    name: apex-tests
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global @salesforce/cli
      - uses: actions/download-artifact@v4
        with: { name: scratch-org }
      - name: Login to scratch org
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ORG_AUTH_KEY -in org.auth.enc -out org.url
          sf org login sfdx-url --sfdx-url-file org.url --alias gavel-scratch
          rm -f org.url
      - name: Run Apex tests with coverage (M5 target 90%)
        run: sf apex run test --target-org gavel-scratch --test-level RunLocalTests --code-coverage --result-format human --wait 60

  evals-offline:
    name: evals-offline
    needs: apex-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --global @salesforce/cli && npm ci
      - uses: actions/download-artifact@v4
        with: { name: scratch-org }
      - name: Login to scratch org
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ORG_AUTH_KEY -in org.auth.enc -out org.url
          sf org login sfdx-url --sfdx-url-file org.url --alias gavel-scratch
          rm -f org.url
      - name: Convergence runner (mock provider only)
        # Tasks and acceptance must all pass. Holdouts are manual (human-judged), so the runner reports
        # LOOP until a maintainer scores them; that gate belongs to the release, not to CI.
        run: |
          GAVEL_ORG=gavel-scratch "$EVALS/run-all.sh" --offline || true
          jq -e '.tasks.pass == .tasks.total and .acceptance.pass == .acceptance.total' "$EVALS/results/convergence-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: "${{ env.EVALS }}/results" }

  cleanup:
    name: cleanup
    needs: [scratch, evals-offline]
    if: always() && needs.scratch.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global @salesforce/cli
      - uses: actions/download-artifact@v4
        with: { name: scratch-org }
        continue-on-error: true
      - name: Delete scratch org
        continue-on-error: true
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ORG_AUTH_KEY -in org.auth.enc -out org.url
          sf org login sfdx-url --sfdx-url-file org.url --alias gavel-scratch
          rm -f org.url
          sf org delete scratch --target-org gavel-scratch --no-prompt
